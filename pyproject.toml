[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ozz-salinity-sim"
version = "0.1.0"
description = "Simulation of voltage-electrode earth-fault protection of a floating platform cable in salt water of varying salinity"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
